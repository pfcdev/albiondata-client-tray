# .github/workflows/release.yml

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag to build and populate
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.event.release.tag_name || inputs.version }}

  publish:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: build-linux
      - uses: actions/download-artifact@v6
        with:
          name: build-windows
      - uses: actions/download-artifact@v6
        with:
          name: build-darwin

      - name: Resolve release upload URL
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.version }}
        run: echo "upload_url=$(gh api "repos/${{ github.repository }}/releases/tags/$RELEASE_TAG" --jq .upload_url)" >> "$GITHUB_OUTPUT"

      - uses: shogo82148/actions-upload-release-asset@v1
        with:
          upload_url: ${{ steps.release.outputs.upload_url }}
          asset_path: update-linux-amd64.gz
          overwrite: true
      - uses: shogo82148/actions-upload-release-asset@v1
        with:
          upload_url: ${{ steps.release.outputs.upload_url }}
          asset_path: update-windows-amd64.exe.gz
          overwrite: true
      - uses: shogo82148/actions-upload-release-asset@v1
        with:
          upload_url: ${{ steps.release.outputs.upload_url }}
          asset_path: albiondata-client-amd64-installer.exe
          overwrite: true
      - uses: shogo82148/actions-upload-release-asset@v1
        with:
          upload_url: ${{ steps.release.outputs.upload_url }}
          asset_path: update-darwin-amd64.gz
          overwrite: true
      - uses: shogo82148/actions-upload-release-asset@v1
        with:
          upload_url: ${{ steps.release.outputs.upload_url }}
          asset_path: albiondata-client-amd64-mac.zip
          overwrite: true
